services:
  api:
    build: ./api
    volumes:
      - ./api/app:/app/app
      - ./data/downloads:/data/downloads
      - ./data/cortes:/data/cortes
    ports:
      - "5101:8000"
    environment:
      DOWNLOADS_DIR: /data/downloads
      CORTES_DIR: /data/cortes
      # Docker Desktop no Windows: watchfiles não vê bind mount sem polling
      WATCHFILES_FORCE_POLLING: "true"
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_nuxt:/app/.nuxt
    ports:
      - "3101:3000"
    environment:
      NUXT_API_URL: http://api:8000
      NUXT_PUBLIC_API_BASE: /api
      NUXT_DOCKER_DEV: "1"
      NUXT_HMR_CLIENT_PORT: "3101"
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    command:
      [
        "sh",
        "-c",
        "npx nuxt prepare && npm run dev -- --host 0.0.0.0 --port 3000",
      ]
    depends_on:
      - api
    restart: unless-stopped

volumes:
  web_node_modules:
  web_nuxt:
